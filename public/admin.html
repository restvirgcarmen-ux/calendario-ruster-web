<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Ruster - Administración</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.8;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .login-box,
    .order-card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .login-box h2,
    .order-card h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .btn-login {
      background: #111827;
      color: white;
      width: 100%;
    }

    .order-card {
      border-left: 5px solid #f59e0b;
    }

    .order-card h2 {
      color: #b45309;
    }

    .data {
      line-height: 1.8;
    }

    .data strong {
      display: inline-block;
      min-width: 120px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .message {
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>CALENDARIO RUSTER</h1>
  <p>Panel de administración</p>
</header>

<div class="container">

  <div id="login-box" class="login-box">
    <h2>Acceso administrador</h2>

    <input
      type="password"
      id="token"
      placeholder="Clave de administrador"
    >

    <button class="btn-login" id="login">
      ENTRAR
    </button>
  </div>

  <div id="panel" class="hidden">

    <div id="message" class="message">
      Cargando solicitudes...
    </div>

    <div id="orders"></div>

  </div>

</div>

<script>
  const loginBox = document.getElementById("login-box");
  const panel = document.getElementById("panel");
  const tokenInput = document.getElementById("token");
  const loginButton = document.getElementById("login");
  const ordersContainer = document.getElementById("orders");
  const message = document.getElementById("message");

  let adminToken = "";

  loginButton.onclick = () => {
    const token = tokenInput.value.trim();

    if (!token) {
      alert("Ingresa la clave de administrador.");
      return;
    }

    adminToken = token;

    cargarPedidos();
  };

  async function cargarPedidos() {
    message.textContent = "Cargando solicitudes...";

    try {
      const response = await fetch(
        "/api/admin/orders?token=" +
        encodeURIComponent(adminToken)
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        alert("Clave incorrecta o acceso no autorizado.");
        return;
      }

      loginBox.classList.add("hidden");
      panel.classList.remove("hidden");

      mostrarPedidos(data.orders);

    } catch (error) {
      alert("No se pudo conectar con el servidor.");
    }
  }

  function mostrarPedidos(orders) {

    ordersContainer.innerHTML = "";

    if (!orders || orders.length === 0) {
      message.textContent = "No hay solicitudes pendientes.";
      return;
    }

    message.textContent =
      "Solicitudes pendientes: " + orders.length;

    orders.forEach(order => {

      const card = document.createElement("div");

      card.className = "order-card";

      card.innerHTML = `
        <h2>🟡 Solicitud pendiente</h2>

        <div class="data">
          <div><strong>Cliente:</strong> ${escapeHtml(order.name)}</div>
          <div><strong>Correo:</strong> ${escapeHtml(order.email)}</div>
          <div><strong>Pedido:</strong> ${escapeHtml(order.id)}</div>
          <div><strong>Producto:</strong> ${escapeHtml(order.product)}</div>
          <div><strong>Método:</strong> ${escapeHtml(order.paymentMethod)}</div>
          <div><strong>Monto:</strong> S/ ${escapeHtml(order.price)}</div>
          <div><strong>Estado:</strong> ${escapeHtml(order.status)}</div>
        </div>

        <div class="actions">
          <button class="approve" disabled>
            ✅ APROBAR DESCARGA
          </button>

          <button class="reject" disabled>
            ❌ RECHAZAR
          </button>
        </div>
      `;

      ordersContainer.appendChild(card);
    });
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
